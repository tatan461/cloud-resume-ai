name: Deploy Chatbot Infrastructure

on:
  push:
    branches: [main]
    paths:
      - "infra/chatbot/**"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  terraform:
    name: Terraform plan & apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/chatbot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # TEMPORARY DEBUG STEP — remove once OIDC works.
      # Prints the exact "sub" claim GitHub is sending in the OIDC token,
      # so we can match it precisely in the IAM trust policy.
      - name: Debug OIDC token claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq .

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-${{ github.run_id }}

      - name: Verify assumed identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false
        env:
          TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}

      - name: Terraform apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve
        env:
          TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}

# NOTE: the static frontend (docs/index.html) is currently served via
# GitHub Pages, which deploys automatically on push without any AWS step.
# If the frontend is ever migrated to S3 + CloudFront (infra/frontend/),
# add a second job here that syncs docs/ to that bucket and invalidates
# the CloudFront distribution, using the same OIDC role.
#
# One-time setup (already done):
#   - AWS_ROLE_ARN (repo Variables)  -> arn:aws:iam::378356708535:role/github-actions-deploy-role
#   - BUDGET_ALERT_EMAIL (repo Secrets) -> email for AWS Budget alerts